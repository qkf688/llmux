services:
  llmux:
    image: qkf688/llmux:latest
    ports:
      - 7070:7070
    volumes:
      - ./db:/app/db
    # 必须 > main.go 的关闭预算（serverShutdownTimeout 30s + credwrite.Stop 10s +
    # bgtaskDrainTimeout 10s = 50s，见 main.shutdown 四步关闭序）。
    # Docker 默认只给 10s，SIGTERM 后进程会在排空 credwrite 队列与后台写库任务前被
    # SIGKILL，优雅关闭形同虚设。k8s 部署同步设 terminationGracePeriodSeconds: 55。
    stop_grace_period: 55s
    environment:
      - GIN_MODE=release
      - JWT_SECRET=<YOUR_JWT_SECRET>
      - ADMIN_PASSWORD=<YOUR_ADMIN_PASSWORD>
      - TZ=Asia/Shanghai
      # 可信代理网段（逗号分隔 IP/CIDR）：反代部署填反代网段，X-Forwarded-For 才会被
      # 采信为访问日志 ClientIP；直连部署留空（= 全关，伪造 XFF 不进日志）。非法值启动即失败。
      - TRUSTED_PROXIES=
